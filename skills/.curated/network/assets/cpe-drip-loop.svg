<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">窗外 CPE 网线滴水弯与开口护管边界</title>
  <desc id="desc">开口护管从窗外开始并在设备 Ethernet 门外终止，网线向下形成最低点后进入接口；错误示例为线缆直接向上进入接口。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#18864b"/>
    </marker>
    <style>
      .label { font: 600 28px system-ui, "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .small { font: 500 22px system-ui, "Noto Sans CJK SC", sans-serif; fill: #365269; }
      .device { fill: #f7fafc; stroke: #425466; stroke-width: 4; }
      .wall { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 3; }
      .window { fill: #dff4ff; stroke: #60a5fa; stroke-width: 4; }
      .cable { fill: none; stroke: #64748b; stroke-width: 8; stroke-linecap: round; }
      .conduit { fill: none; stroke: #111827; stroke-width: 20; stroke-linecap: round; stroke-dasharray: 5 5; }
      .guide { fill: none; stroke: #1769aa; stroke-width: 4; marker-end: url(#arrow-blue); }
      .rain { fill: #2b9fe8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="360" height="720" class="wall"/>
  <rect x="90" y="70" width="210" height="440" rx="8" class="window"/>
  <line x1="300" y1="70" x2="300" y2="510" stroke="#475569" stroke-width="10"/>
  <text x="60" y="560" class="label">室内</text>
  <text x="390" y="70" class="label">室外</text>

  <rect x="795" y="105" width="240" height="285" rx="28" class="device"/>
  <text x="845" y="175" class="label">定向 CPE</text>
  <text x="830" y="225" class="small">正面朝向目标 AP</text>
  <rect x="875" y="365" width="80" height="45" rx="8" fill="#cbd5e1" stroke="#425466" stroke-width="3"/>
  <text x="805" y="340" class="small">Ethernet/PoE-in</text>
  <line x1="1035" y1="210" x2="1150" y2="210" stroke="#18864b" stroke-width="7" marker-end="url(#arrow-green)"/>
  <text x="1060" y="170" class="small">目标 AP</text>

  <path d="M220 470 C310 470 360 500 430 520 C560 555 630 650 760 620 C820 605 850 555 870 500" class="conduit"/>
  <path d="M220 470 C310 470 360 500 430 520 C560 555 630 650 760 620 C875 595 900 500 915 410" class="cable"/>
  <path d="M195 470 C205 470 212 470 220 470" class="cable"/>
  <line x1="225" y1="430" x2="225" y2="505" stroke="#d97706" stroke-width="5"/>
  <text x="40" y="620" class="small">护管从窗外开始，</text>
  <text x="40" y="652" class="small">不要夹进窗缝</text>
  <path d="M260 600 C320 580 350 550 395 530" class="guide"/>

  <line x1="870" y1="475" x2="870" y2="525" stroke="#d97706" stroke-width="5"/>
  <text x="630" y="450" class="small">护管停在设备门外，</text>
  <text x="630" y="482" class="small">只有网线进入原厂开口</text>
  <path d="M790 490 C825 500 850 500 866 500" class="guide"/>

  <circle cx="650" cy="645" r="8" fill="#1769aa"/>
  <text x="470" y="690" class="label">最低点：雨水在这里滴落</text>
  <path class="rain" d="M620 585 C610 602 608 611 620 620 C632 611 630 602 620 585z"/>
  <path class="rain" d="M675 605 C665 622 663 631 675 640 C687 631 685 622 675 605z"/>

  <rect x="35" y="25" width="245" height="70" rx="16" fill="#e8f7ef" stroke="#18864b" stroke-width="3"/>
  <text x="90" y="70" class="label" fill="#18864b">正确路径</text>

  <rect x="880" y="525" width="285" height="150" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="4"/>
  <path d="M935 640 C960 590 995 565 1030 555" class="cable"/>
  <rect x="1010" y="530" width="65" height="35" rx="7" fill="#cbd5e1" stroke="#425466" stroke-width="3"/>
  <line x1="1090" y1="565" x2="1140" y2="625" stroke="#dc2626" stroke-width="10"/>
  <line x1="1140" y1="565" x2="1090" y2="625" stroke="#dc2626" stroke-width="10"/>
  <text x="900" y="665" class="small" fill="#b91c1c">错误：线缆向上进接口</text>
</svg>
